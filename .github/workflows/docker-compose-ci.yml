name: Docker Compose CI/CD

on:
  pull_request:
    branches: ["main", "preprod"]
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  CLIENT_IMAGE_NAME: farigoule-client
  SERVER_IMAGE_NAME: farigoule-server

jobs:
  #───────────────────────────────────────────────────────────────────────────────
  # 1) CI : Validation du build sur les PR
  #───────────────────────────────────────────────────────────────────────────────
  validate-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Compose (dev mode)
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.dev.yml \
            build

  #───────────────────────────────────────────────────────────────────────────────
  # 2) CD : Build + Push des images sur GHCR (uniquement sur push)
  #───────────────────────────────────────────────────────────────────────────────
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # — Connexion au GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # — Détermine les tags (branch + SHA)
      - name: Determine image tags
        id: prep_tags
        run: |
          branch="${{ github.ref_name }}"
          if [ "$branch" = "main" ]; then
            echo "BRANCH_TAG=production" >> $GITHUB_OUTPUT
          else
            echo "BRANCH_TAG=$branch" >> $GITHUB_OUTPUT
          fi
          echo "SHA_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      # — Build & push avec le tag de branche (prod)
      - name: Build & push images (prod)
        env:
          NODE_ENV: production
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          TAG: ${{ steps.prep_tags.outputs.BRANCH_TAG }}
          CLIENT_PORT: ${{ vars.CLIENT_PORT }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          API_BACKEND_URL: ${{ vars.API_BACKEND_URL }}
          JWT_EXPIRY: ${{ vars.JWT_EXPIRY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            build
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            push

      # — Retag avec le SHA et push
      - name: Retag & push images (SHA)
        run: |
          CLIENT_BRANCH_IMG="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.CLIENT_IMAGE_NAME }}:${{ steps.prep_tags.outputs.BRANCH_TAG }}"
          SERVER_BRANCH_IMG="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.SERVER_IMAGE_NAME }}:${{ steps.prep_tags.outputs.BRANCH_TAG }}"
          CLIENT_SHA_IMG="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.CLIENT_IMAGE_NAME }}:${{ steps.prep_tags.outputs.SHA_TAG }}"
          SERVER_SHA_IMG="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.SERVER_IMAGE_NAME }}:${{ steps.prep_tags.outputs.SHA_TAG }}"

          docker tag "$CLIENT_BRANCH_IMG" "$CLIENT_SHA_IMG"
          docker tag "$SERVER_BRANCH_IMG" "$SERVER_SHA_IMG"

          docker push "$CLIENT_SHA_IMG"
          docker push "$SERVER_SHA_IMG"
