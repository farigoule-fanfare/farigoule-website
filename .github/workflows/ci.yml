name: Docker Compose CI/CD

on:
    # ——— Pull-requests : simple validation du build
    pull_request:
        branches: ["main"]

    # ——— Pushes : build + push des images
    push:
        branches: ["main"]

# Variables « techniques » communes (ne contiennent ni secrets ni vars)
env:
    REGISTRY: ghcr.io
    IMAGE_OWNER: ${{ github.repository_owner }}
    CLIENT_IMAGE_NAME: farigoule-client
    SERVER_IMAGE_NAME: farigoule-server

jobs:
    #─────────────────────────────────────────────────────────────────[...]
    # 1) CI : vérifier que le build passe sur les PR
    #─────────────────────────────────────────────────────────────────[...]
    validate-build:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        environment: "Production – farigoule-vercel-server"
        steps:
            - uses: actions/checkout@v4

            - name: Build Docker images for validation (no push)
              env:
                  REGISTRY: ${{ env.REGISTRY }}
                  IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
                  TAG: test-pr
              run: |
                  set -euo pipefail

                  CLIENT_IMG="${REGISTRY}/${IMAGE_OWNER}/${{ env.CLIENT_IMAGE_NAME }}"
                  SERVER_IMG="${REGISTRY}/${IMAGE_OWNER}/${{ env.SERVER_IMAGE_NAME }}"

                  docker build -f client/Dockerfile -t "${CLIENT_IMG}:${TAG}" client
                  docker build -f server/Dockerfile -t "${SERVER_IMG}:${TAG}" server

    #─────────────────────────────────────────────────────────────────[...]
    # 2) CD : build + push sur GHCR lors d’un push
    #─────────────────────────────────────────────────────────────────[...]
    build-and-push:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        environment: "Production – farigoule-vercel-server"
        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            # — Connexion au GitHub Container Registry
            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # — Tag court basé sur le commit
            - name: Determine SHA tag
              id: prep_tags
              run: |
                  echo "SHA_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

            - name: Build & push images (latest + commit SHA)
              env:
                  REGISTRY: ${{ env.REGISTRY }}
                  IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
                  SHA_TAG: ${{ steps.prep_tags.outputs.SHA_TAG }}
              run: |
                  set -euo pipefail

                  CLIENT_IMG="${REGISTRY}/${IMAGE_OWNER}/${{ env.CLIENT_IMAGE_NAME }}"
                  SERVER_IMG="${REGISTRY}/${IMAGE_OWNER}/${{ env.SERVER_IMAGE_NAME }}"

                  # Build une fois, tag deux fois
                  docker build -f client/Dockerfile \
                    -t "${CLIENT_IMG}:latest" \
                    -t "${CLIENT_IMG}:${SHA_TAG}" \
                    client

                  docker build -f server/Dockerfile \
                    -t "${SERVER_IMG}:latest" \
                    -t "${SERVER_IMG}:${SHA_TAG}" \
                    server

                  # Push des deux tags
                  docker push "${CLIENT_IMG}:latest"
                  docker push "${CLIENT_IMG}:${SHA_TAG}"
                  docker push "${SERVER_IMG}:latest"
                  docker push "${SERVER_IMG}:${SHA_TAG}"
