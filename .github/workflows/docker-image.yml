# .github/workflows/docker-compose-ci.yml

name: Docker Compose CI/CD

on:
  # Trigger the workflow on pushes and pull requests to main and preprod
  push:
    branches: [ "main", "preprod" ]
  pull_request:
    branches: [ "main", "preprod" ]

# Use environment variables for registry details to keep the steps clean
env:
  REGISTRY: ghcr.io
  # github.repository_owner is the organization or user that owns the repository
  IMAGE_OWNER: ${{ github.repository_owner }}
  # Define the base image names here for reusability
  CLIENT_IMAGE_NAME: farigoule-client
  SERVER_IMAGE_NAME: farigoule-server

jobs:
  # This job runs on pull requests to validate the Docker build without pushing
  validate-build:
    name: Validate Docker Build
    # Run this job only for pull_request events
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose services for validation
        # This step only builds the images to ensure they are valid. It does not push.
        run: docker compose -f docker-compose.dev.yml build

  # This job runs on pushes to 'main' or 'preprod' to build and push images
  build-and-push:
    name: Build and Push Images
    # Run this job only for push events on the specified branches
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Grant permissions for the job to write to GitHub Packages
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tags
        id: prep_tags
        # This step sets two output variables: BRANCH_TAG and SHA_TAG
        run: |
          branch_name=${{ github.ref_name }}
          if [ "$branch_name" == "main" ]; then
            echo "BRANCH_TAG=production" >> $GITHUB_OUTPUT
          else
            echo "BRANCH_TAG=$branch_name" >> $GITHUB_OUTPUT
          fi
          echo "SHA_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and Push with Branch Tag
        # Docker Compose needs the image names with the tag defined as environment variables.
        # We set DOCKER_CLIENT_IMAGE and DOCKER_SERVER_IMAGE which should be used
        # in the 'image:' field of your docker-compose.yml file.
        # Example docker-compose.yml service:
        #   client:
        #     image: ${{DOCKER_CLIENT_IMAGE}}
        #     build: ./client
        env:
          DOCKER_CLIENT_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.CLIENT_IMAGE_NAME }}:${{ steps.prep_tags.outputs.BRANCH_TAG }}
          DOCKER_SERVER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.SERVER_IMAGE_NAME }}:${{ steps.prep_tags.outputs.BRANCH_TAG }}
        run: |
          docker compose -f docker-compose.dev.yml build
          docker compose -f docker-compose.dev.yml push

      - name: Re-tag and Push with SHA Tag
        # This step creates an additional, immutable tag for the same images.
        # This provides a precise reference to the exact version of the code.
        run: |
          # Define image names for clarity
          CLIENT_IMAGE_BRANCH_TAGGED="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.CLIENT_IMAGE_NAME }}:${{ steps.prep_tags.outputs.BRANCH_TAG }}"
          SERVER_IMAGE_BRANCH_TAGGED="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.SERVER_IMAGE_NAME }}:${{ steps.prep_tags.outputs.BRANCH_TAG }}"
          
          CLIENT_IMAGE_SHA_TAGGED="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.CLIENT_IMAGE_NAME }}:${{ steps.prep_tags.outputs.SHA_TAG }}"
          SERVER_IMAGE_SHA_TAGGED="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.SERVER_IMAGE_NAME }}:${{ steps.prep_tags.outputs.SHA_TAG }}"

          # Re-tag the images with the short SHA
          docker tag "$CLIENT_IMAGE_BRANCH_TAGGED" "$CLIENT_IMAGE_SHA_TAGGED"
          docker tag "$SERVER_IMAGE_BRANCH_TAGGED" "$SERVER_IMAGE_SHA_TAGGED"
          
          # Push the new SHA-based tags
          docker push "$CLIENT_IMAGE_SHA_TAGGED"
          docker push "$SERVER_IMAGE_SHA_TAGGED"
