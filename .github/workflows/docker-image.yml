# .github/workflows/docker-compose-ci.yml

name: Docker Compose CI/CD

on:
  push:
    branches: [ "main", "preprod" ]
  pull_request:
    branches: [ "main" ]

# Use environment variables for registry details to keep the steps clean
env:
  REGISTRY: ghcr.io
  # github.repository_owner is the organization or user that owns the repository
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # This job runs on pull requests to validate the Docker build
  build:
    name: Build Images for Validation
    # Run this job only for pull_request events
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose services
        run: docker compose build

  # This job runs on pushes to 'main' or 'preprod' to build and push images
  build-and-push:
    name: Build and Push Images
    # Run this job only for push events
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Grant permissions for the job to write to GitHub Packages
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        # This step creates an environment variable `IMAGE_TAG`
        # It will be 'latest' for the main branch, or the branch name (e.g., 'preprod') otherwise.
        run: |
          branch=${{ github.ref_name }}
          if [ "$branch" == "main" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=$branch" >> $GITHUB_ENV
          fi
          # Also create a unique tag based on the commit SHA
          echo "SHA_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and Push with Branch Tag
        # Docker Compose will use the IMAGE_TAG env var to tag the images
        # e.g., ghcr.io/your-org/farigoule-client:latest
        env:
          TAG: ${{ env.IMAGE_TAG }}
        run: |
          docker compose -f docker-compose.dev.yml build
          docker compose -f docker-compose.dev.yml push

      - name: Re-tag and Push with SHA Tag
        # This step creates an additional, unique tag for the same images
        # e.g., ghcr.io/your-org/farigoule-client:a1b2c3d
        # This provides an immutable reference to the exact version of the code.
        run: |
          docker tag ghcr.io/${{ env.IMAGE_OWNER }}/farigoule-client:${{ env.IMAGE_TAG }} ghcr.io/${{ env.IMAGE_OWNER }}/farigoule-client:${{ env.SHA_TAG }}
          docker tag ghcr.io/${{ env.IMAGE_OWNER }}/farigoule-server:${{ env.IMAGE_TAG }} ghcr.io/${{ env.IMAGE_OWNER }}/farigoule-server:${{ env.SHA_TAG }}
          
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/farigoule-client:${{ env.SHA_TAG }}
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/farigoule-server:${{ env.SHA_TAG }}
