# -------------------------------------------------------------------
# docker-compose.prod.yml — configuration orientée déploiement
# -------------------------------------------------------------------
# ⚠️  Ce fichier **n’effectue pas** de build : il référence directement les
#     images déjà publiées sur le GitHub Container Registry.
#     Placez les variables suivantes dans un fichier .env (ou variables
#     d’env système) avant de lancer : REGISTRY, IMAGE_OWNER, TAG,
#     CLIENT_IMAGE_NAME, SERVER_IMAGE_NAME, CLIENT_PORT, SERVER_PORT,
#     FRONTEND_URL, REACT_APP_RESTAPI_SERVER_URI.
# -------------------------------------------------------------------

services:
  client:
    image: ${REGISTRY}/${IMAGE_OWNER}/${CLIENT_IMAGE_NAME}:${TAG}
    container_name: farigoule-client
    env_file:
      - client/.env
    environment:
      - NODE_ENV=production
      - VIRTUAL_HOST=fanfare-farigoule.com
      - LETSENCRYPT_HOST=fanfare-farigoule.com
    ports:
      - "${CLIENT_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - farigoule-network
    depends_on:
      - server

  server:
    image: ${REGISTRY}/${IMAGE_OWNER}/${SERVER_IMAGE_NAME}:${TAG}
    container_name: farigoule-server
    env_file:
      - server/.env
    environment:
      - NODE_ENV=production
      - PORT=${SERVER_PORT}
      - FRONTEND_URL=${FRONTEND_URL}
      - REACT_APP_RESTAPI_SERVER_URI=${REACT_APP_RESTAPI_SERVER_URI}
    volumes:
      - farigoule-db-storage:/usr/app/database
      - farigoule-uploads-storage:/usr/app/public/uploads
    restart: unless-stopped
    networks:
      - farigoule-network

volumes:
  # Déclarées pour garantir la persistance des données.
  # Elles seront ré‑utilisées si elles existent déjà.
  farigoule-db-storage:
    name: farigoule-db-storage
  farigoule-uploads-storage:
    name: farigoule-uploads-storage

networks:
  farigoule-network:
    name: farigoule-network
