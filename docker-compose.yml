version: '3.8'

services:
  client:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-your-github-username}/farigoule-client:${TAG:-latest}
    container_name: farigoule-client
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - VIRTUAL_HOST=fanfare-farigoule.com
      - LETSENCRYPT_HOST=fanfare-farigoule.com
      - API_BACKEND_URL=${API_BACKEND_URL}
    ports:
      - "${CLIENT_PORT}:80"
    restart: unless-stopped
    networks:
      - farigoule-network
    depends_on:
      - server

  server:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-your-github-username}/farigoule-server:${TAG:-latest}
    container_name: farigoule-server
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=${SERVER_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY}
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      - farigoule-db-storage:/usr/app/database/
      - farigoule-uploads-storage:/usr/app/public/uploads
    restart: unless-stopped
    networks:
      - farigoule-network

volumes:
  farigoule-db-storage:
    driver: local
  farigoule-uploads-storage:
    driver: local

networks:
  farigoule-network:
    driver: bridge
