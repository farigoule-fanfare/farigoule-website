services:
  client:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-your-github-username}/farigoule-client:${TAG:-latest}
    container_name: farigoule-client
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - API_BACKEND_URL=${API_BACKEND_URL:-http://localhost:5000}
    ports:
      - "${CLIENT_PORT:-3000}:80"
    restart: unless-stopped
    networks:
      - farigoule-network
    depends_on:
      - server

  server:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-your-github-username}/farigoule-server:${TAG:-latest}
    container_name: farigoule-server
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${SERVER_PORT:-5000}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    restart: unless-stopped
    networks:
      - farigoule-network
    volumes:
      - farigoule-db-storage:/usr/app/database/
      - farigoule-uploads-storage:/usr/app/public/uploads

volumes:
  farigoule-db-storage:
    driver: local
  farigoule-uploads-storage:
    driver: local

networks:
  farigoule-network:
    driver: bridge
