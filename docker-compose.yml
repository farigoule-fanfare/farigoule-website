services:
    client:
        image: ghcr.io/farigoule-fanfare/farigoule-client:production
        container_name: farigoule-client
        labels:
          - "traefik.enable=true"
          - "traefik.docker.network=dokploy-network"
          - "traefik.http.routers.vw.rule=Host(`fanfare.ginfo.centrale-med.fr`)"
          - "traefik.http.routers.vw.entrypoints=websecure"
          - "traefik.http.routers.vw.tls=true"
          - "traefik.http.services.vw.loadbalancer.server.port=80"  
        environment:
            - NODE_ENV=production
            - API_BACKEND_URL=http://server:80
        restart: unless-stopped
        networks:
            - farigoule-network
            - dokploy-network
        depends_on:
            - server

    server:
        image: ghcr.io/farigoule-fanfare/farigoule-server:production
        container_name: farigoule-server
        environment:
            - NODE_ENV=production
            - PORT=80
            - JWT_SECRET=${JWT_SECRET}
            - FRONTEND_URL=https://fanfare.ginfo.centrale-med.fr
        volumes:
            - farigoule-db-storage:/usr/app/database/
            - farigoule-uploads-storage:/usr/app/public/uploads
        restart: unless-stopped
        networks:
            - farigoule-network

volumes:
    farigoule-db-storage:
        external: true
        name: farigoule-db-storage
    farigoule-uploads-storage:
        external: true
        name: farigoule-uploads-storage
networks:
    farigoule-network:
        name: farigoule-network
        internal: true
    dokploy-network:
        name: dokploy-network
        external: true
