services:
  client:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-your-github-username}/farigoule-client:${TAG:-latest}
    container_name: farigoule-client
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - API_BACKEND_URL=${API_BACKEND_URL:-http://localhost:5000}
    restart: unless-stopped
    networks:
      - farigoule-network
    depends_on:
      - server

  server:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:-your-github-username}/farigoule-server:${TAG:-latest}
    container_name: farigoule-server
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${SERVER_PORT:-5000}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    restart: unless-stopped
    networks:
      - farigoule-network
    volumes:
      - ./server/database:/usr/app/database
      - ./server/public/uploads:/usr/app/public/uploads

networks:
  farigoule-network:
    driver: bridge
