services:
    client:
        image: ghcr.io/farigoule-fanfare/farigoule-client:production
        container_name: farigoule-client
        environment:
            - NODE_ENV=production
            - VIRTUAL_HOST=fanfare-farigoule.com
            - LETSENCRYPT_HOST=fanfare-farigoule.com
            - API_BACKEND_URL=http://server:80
        restart: unless-stopped
        networks:
            - farigoule-network
        depends_on:
            - server

    server:
        image: ghcr.io/farigoule-fanfare/farigoule-server:production
        container_name: farigoule-server
        environment:
            - NODE_ENV=production
            - PORT=80
            - JWT_SECRET=${JWT_SECRET}
            - JWT_EXPIRY=${JWT_EXPIRY}
            - FRONTEND_URL=https://fanfare-farigoule.com
        volumes:
            - farigoule-db-storage:/usr/app/database/
            - farigoule-uploads-storage:/usr/app/public/uploads
        restart: unless-stopped
        networks:
            - farigoule-network

volumes:
    farigoule-db-storage:
        external: true
        name: farigoule-db-storage
    farigoule-uploads-storage:
        external: true
        name: farigoule-uploads-storage
networks:
    farigoule-network:
        name: farigoule-network
        internal: true
    nginx-proxy-ginfo:
        external: true
