# client/nginx.conf
events {}

http {
    # ➜ charge la table des types : .css → text/css, .js → application/javascript, …
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;

        # ---------- Assets : jamais d’index.html ----------
        location /static/  {  try_files $uri =404;  expires 1y; }
        location /assets/  {  try_files $uri =404;  expires 1y; }

        # ---------- Fallback SPA --------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
