# client/nginx.conf
events {}

http {
	# ➜ charge la table des types : .css → text/css, .js → application/javascript, …
	include		/etc/nginx/mime.types;
	default_type	application/octet-stream;

	server {
		listen 80;
		server_name _;

		root /usr/share/nginx/html;

		# ---------- Assets : jamais d’index.html ----------
		location /static/	{	try_files $uri =404;	expires 1y; }
		location /assets/	{	try_files $uri =404;	expires 1y; }

		location /api/ {
			proxy_pass		 http://server:5000/;
			proxy_http_version 1.1;
			proxy_set_header	Host				$host;
			proxy_set_header	X-Real-IP			$remote_addr;
			proxy_set_header	X-Forwarded-For	$proxy_add_x_forwarded_for;
			proxy_set_header	X-Forwarded-Proto	$scheme;
			# si vous utilisez WebSocket :
			# proxy_set_header	Upgrade 		$http_upgrade;
			# proxy_set_header	Connection		 "upgrade";
		}

		# ---------- Fallback SPA --------------------------
		location / {
			try_files $uri $uri/ /index.html;
		}
	}
}
